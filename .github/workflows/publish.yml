name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Publish
        run: >
          dotnet publish src/News.Client.WinUI3/News.Client.WinUI3.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          --output publish/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: news-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
