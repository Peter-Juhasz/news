groups:
  - title: Tech
    sources:
      # rss for an RSS 2.0 feed; a feed whose root element is <feed> is Atom, and takes atom.
      - type: rss
        url: https://devblogs.microsoft.com/dotnet/feed/
        frequency: 00:30:00
        # Optional: shown in the details pane instead of the article's host name.
        title: .NET Blog
        # Optional, rss, atom and html only: a CSS selector for the article body in the page an item links to.
        # Where it is set, the body is fetched from that page instead of read from the feed —
        # for the feeds that publish no more than a teaser.
        # selector: article .entry-content
      - type: reddit
        subreddit: dotnet
        frequency: 00:15:00
        title: r/dotnet
        # Optional: text, html or web. Items from this source are shown in this view.
        view: web
      - type: youtube
        channelId: UCvtT19MZW8dq5Wwfu6B0oxw
        frequency: 01:00:00
        title: dotnet
      - type: github
        repository: dotnet/runtime
        # Optional: releases (the default), tags, commits, issues or pulls. Commits are the default
        # branch's. Issues and pulls come from GitHub's API, which allows 60 requests an hour
        # without signing in, shared by every issues and pulls source.
        feed: releases
        frequency: 01:00:00
        title: .NET Runtime releases
      - type: github
        repository: dotnet/runtime
        feed: pulls
        frequency: 00:30:00
        title: .NET Runtime PRs
      # html for a page that lists stories without publishing a feed. Its selectors take an element
      # name, classes, IDs and exact attribute values, and descendants of those separated by spaces.
      # - type: html
      #   url: https://example.com/news
      #   frequency: 01:00:00
      #   title: Example News
      #   # Picks each story out of the page.
      #   item: ul.stories li
      #   # Optional, each picked out of the story. Without a title, the story's whole text is its
      #   # title; without a url, its link is the story itself or the first link inside it. A date
      #   # is read from a datetime attribute, as on <time>, or else from the text, in the language
      #   # the page declares; a story without one is dated when it is loaded.
      #   properties:
      #     title: h2
      #     date: time
      #     lead: p.summary
      #     url: h2 a
      # x for an account's newest posts on X, leaving out its replies and reposts. It and x-search
      # read X's API as an X app, whose API key and secret are set as X__ApiKey and X__ApiSecret in
      # the environment or the .env file. X charges for each post a load returns, though not again
      # for one it already returned the same (UTC) day.
      # - type: x
      #   username: XDevelopers
      #   frequency: 01:00:00
      #   title: X Developers
      # x-search for the newest posts matching a search in X's query language, from the whole archive.
      # - type: x-search
      #   query: "#dotnet -is:retweet -is:reply lang:en"
      #   frequency: 01:00:00
      #   title: "#dotnet on X"
